name: Apply mobile portrait release patch

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/apply-mobile-portrait-cache-bust.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apply-mobile-portrait-release
  cancel-in-progress: false

jobs:
  patch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Make the mobile correction cache-safe
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')

          old_css = '<link rel="stylesheet" href="site.css?v=20260727.3">'
          new_css = (
              '<link rel="stylesheet" href="site.css?v=20260727.4">\n'
              '<link rel="stylesheet" href="mobile-portrait-fix.css?v=20260727.4">'
          )
          old_js = '<script src="site.js?v=20260727.3" defer></script>'
          new_js = '<script src="site.js?v=20260727.4" defer></script>'

          if old_css in html:
              html = html.replace(old_css, new_css, 1)
          elif 'mobile-portrait-fix.css?v=20260727.4' not in html:
              raise SystemExit('Expected base stylesheet marker was not found.')

          if old_js in html:
              html = html.replace(old_js, new_js, 1)
          elif new_js not in html:
              raise SystemExit('Expected script marker was not found.')

          required = [
              'mobile-portrait-fix.css?v=20260727.4',
              'site.js?v=20260727.4',
              'M. Kathleen, LLC',
              'Melodie Craig',
          ]
          missing = [item for item in required if item not in html]
          if missing:
              raise SystemExit(f'Mobile release validation failed: {missing}')

          path.write_text(html, encoding='utf-8')
          PY

          rm -f .github/workflows/apply-mobile-portrait-cache-bust.yml

      - name: Commit and publish the corrected mobile release
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html .github/workflows/apply-mobile-portrait-cache-bust.yml
          git commit -m 'Publish cache-safe mobile founder portrait fix'
          git push origin HEAD:main
